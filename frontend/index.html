<!DOCTYPE html>
<html>
<head>
  <title>SmartBlock Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box login-box">
    <h1>SmartBlock</h1>
    <p class="hint">Railway maintenance block planning</p>

    <label>Username</label>
    <input type="text" id="username">

    <label>Password</label>
    <input type="password" id="password">

    <div class="error" id="error"></div>
    <button onclick="doLogin()">Login</button>

    <p class="hint">
      Demo logins:<br>
      admin / admin123<br>
      engineering / eng123<br>
      signal / sig123<br>
      traction / trac123
    </p>
  </div>

  <script src="script.js"></script>
  <script>
    function doLogin() {
      var u = document.getElementById('username').value.trim().toLowerCase();
      var p = document.getElementById('password').value;
      var found = USERS.filter(function (x) { return x.username === u && x.password === p; })[0];

      if (!found) {
        document.getElementById('error').textContent = 'Wrong username or password';
        return;
      }
      sessionStorage.setItem('user', JSON.stringify(found));
      window.location = found.role === 'admin' ? 'admin.html' : 'department.html';
    }

    document.getElementById('password').onkeydown = function (e) {
      if (e.key === 'Enter') doLogin();
    };
  </script>
</body>
</html>
